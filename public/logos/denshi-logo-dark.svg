<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Denshi Innovation Club Official Logo (Dark Variant - Transparent Background) -->
  
  <g id="denshi-emblem-dark" transform="translate(65, 30)">
    <!-- Letter D with transparent inner cutout (White) -->
    <path 
      d="M 50,40 L 155,40 C 225,40 260,78 260,140 C 260,202 225,240 155,240 L 50,240 Z M 95,78 L 145,78 C 188,78 215,102 215,140 C 215,178 188,202 145,202 L 95,202 Z" 
      fill="#FFFFFF" 
      fill-rule="evenodd" 
    />

    <!-- Bulb Circuit Elements Inside D (Electric Blue) -->
    <circle cx="138" cy="115" r="18" fill="none" stroke="#2563EB" stroke-width="7" />
    <rect x="134.5" y="128" width="7" height="52" rx="3.5" fill="#2563EB" />
    <rect x="118" y="184" width="40" height="6.5" rx="3.25" fill="#2563EB" />
    <rect x="123" y="195" width="30" height="6.5" rx="3.25" fill="#2563EB" />
    <rect x="129" y="206" width="18" height="6" rx="3" fill="#2563EB" />

    <!-- Letter C (Vibrant Electric Blue) -->
    <path 
      d="M 405,75 C 380,52 346,40 305,40 C 225,40 178,92 178,140 C 178,188 225,240 305,240 C 346,240 380,228 405,205 L 372,174 C 354,192 332,201 305,201 C 252,201 222,168 222,140 C 222,112 252,79 305,79 C 332,79 354,88 372,106 Z" 
      transform="translate(68, 0)" 
      fill="#2563EB" 
    />
  </g>

  <!-- Typography Lockup (Transparent Background) -->
  <!-- DENSHI -->
  <text 
    x="300" 
    y="345" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Outfit', sans-serif" 
    font-size="68" 
    font-weight="900" 
    letter-spacing="18" 
    fill="#FFFFFF">DENSHI</text>

  <!-- INNOVATION CLUB -->
  <text 
    x="300" 
    y="388" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Outfit', sans-serif" 
    font-size="21" 
    font-weight="800" 
    letter-spacing="14" 
    fill="#E5E1D8">INNOVATION CLUB</text>
</svg>
