<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Skill Development Cell (SDC) - SINCET Official Logo -->
  <defs>
    <!-- Deep Royal Blue Ring Gradient -->
    <linearGradient id="sdc-blue-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a8a" />
      <stop offset="50%" stop-color="#082866" />
      <stop offset="100%" stop-color="#041842" />
    </linearGradient>

    <!-- Metallic Silver Border Gradient -->
    <linearGradient id="silver-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Top Text Arc -->
    <path id="sdc-top-arc" d="M 95,250 A 155,155 0 0,1 405,250" fill="none" />
    <!-- Bottom Text Arc (Upright Left-to-Right along bottom curve) -->
    <path id="sdc-bottom-arc" d="M 70,250 A 180,180 0 0,0 430,250" fill="none" />

    <!-- Golden Star Definition (Large - Center, R=11.5) -->
    <polygon id="sdc-star-large" points="0,-11.5 2.82,-3.88 10.94,-3.55 4.57,1.48 6.76,9.30 0,4.8 -6.76,9.30 -4.57,1.48 -10.94,-3.55 -2.82,-3.88" />

    <!-- Golden Star Definition (Medium - Flanking, R=9.5) -->
    <polygon id="sdc-star-medium" points="0,-9.5 2.33,-3.21 9.03,-2.94 3.77,1.22 5.58,7.69 0,3.96 -5.58,7.69 -3.77,1.22 -9.03,-2.94 -2.33,-3.21" />
  </defs>

  <!-- Outer Royal Blue Band -->
  <circle cx="250" cy="250" r="215" fill="url(#sdc-blue-ring)" stroke="#cbd5e1" stroke-width="4" />

  <!-- Inner Silver Bevel Rim -->
  <circle cx="250" cy="250" r="148" fill="#ffffff" stroke="url(#silver-rim)" stroke-width="6" />

  <!-- Top Arched Text: SKILL DEVELOPMENT CELL -->
  <text font-family="'Montserrat', 'Arial Black', sans-serif" font-size="24.5" font-weight="900" fill="#ffffff" letter-spacing="3.5">
    <textPath href="#sdc-top-arc" startOffset="50%" text-anchor="middle">
      SKILL DEVELOPMENT CELL
    </textPath>
  </text>

  <!-- Bottom Arched Text: SINCET -->
  <text font-family="'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="8">
    <textPath href="#sdc-bottom-arc" startOffset="50%" text-anchor="middle">
      SINCET
    </textPath>
  </text>

  <!-- Gold Stars (3 on left, 3 on right - radially aligned along arc R=181.5) -->
  <g fill="#f59e0b" stroke="#b45309" stroke-width="0.75">
    <!-- Left Stars -->
    <g transform="translate(73.15, 209.17)">
      <use href="#sdc-star-medium" />
    </g>
    <g transform="translate(68.5, 250)">
      <use href="#sdc-star-large" />
    </g>
    <g transform="translate(73.15, 290.83)">
      <use href="#sdc-star-medium" />
    </g>

    <!-- Right Stars -->
    <g transform="translate(426.85, 209.17)">
      <use href="#sdc-star-medium" />
    </g>
    <g transform="translate(431.5, 250)">
      <use href="#sdc-star-large" />
    </g>
    <g transform="translate(426.85, 290.83)">
      <use href="#sdc-star-medium" />
    </g>
  </g>

  <!-- Inner Center Graphic -->
  <g transform="translate(250, 255)">
    <!-- Thin connecting lines to the 5 nodes -->
    <line x1="0" y1="-30" x2="-80" y2="-20" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="0" y1="-30" x2="-55" y2="-85" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="0" y1="-30" x2="0" y2="-100" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="0" y1="-30" x2="55" y2="-85" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="0" y1="-30" x2="80" y2="-20" stroke="#cbd5e1" stroke-width="2.5" />

    <!-- Open Book at bottom -->
    <g transform="translate(0, 45)">
      <!-- Left pages in royal blue -->
      <path d="M -55,-10 C -35,5 -15,5 0,0 L 0,22 C -15,16 -35,16 -55,4 Z" fill="#0d3b8f" />
      <!-- Right pages in royal blue -->
      <path d="M 55,-10 C 35,5 15,5 0,0 L 0,22 C 15,16 35,16 55,4 Z" fill="#1e60cb" />
      <!-- Book spine lines -->
      <line x1="-50" y1="-4" x2="-5" y2="4" stroke="#ffffff" stroke-width="1.5" />
      <line x1="-50" y1="2" x2="-5" y2="10" stroke="#ffffff" stroke-width="1.5" />
      <line x1="50" y1="-4" x2="5" y2="4" stroke="#ffffff" stroke-width="1.5" />
      <line x1="50" y1="2" x2="5" y2="10" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Sprouting Stylized Figure / Leaves -->
    <!-- Left Blue Wing/Leaf/Person -->
    <path d="M 0,35 C -32,25 -52,-5 -40,-45 C -30,-20 -15,-5 0,5 Z" fill="#1e65d8" />
    <!-- Right Green Wing/Leaf/Person -->
    <path d="M 0,35 C 32,25 52,-5 40,-45 C 30,-20 15,-5 0,5 Z" fill="#22c55e" />
    <!-- Center Person Head -->
    <circle cx="0" cy="-25" r="9" fill="#0d3b8f" />

    <!-- Golden Star above Head (Geometrically balanced & centered) -->
    <polygon points="0,-68 2.82,-60.38 10.94,-60.05 4.57,-55.02 6.76,-47.20 0,-51.70 -6.76,-47.20 -4.57,-55.02 -10.94,-60.05 -2.82,-60.38" fill="#f59e0b" stroke="#b45309" stroke-width="0.75" />

    <!-- 5 Skill Badges -->
    <!-- Node 1: Target (Orange) -->
    <g transform="translate(-80, -20)">
      <circle cx="0" cy="0" r="18" fill="#f97316" stroke="#ea580c" stroke-width="1.5" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#ffffff" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="2" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <!-- Node 2: Coding Monitor (Purple) -->
    <g transform="translate(-55, -85)">
      <circle cx="0" cy="0" r="18" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1.5" />
      <rect x="-9" y="-8" width="18" height="13" rx="1.5" fill="#ffffff" />
      <rect x="-7" y="-6" width="14" height="9" rx="1" fill="#6d28d9" />
      <text x="0" y="0.5" font-family="monospace" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
      <line x1="-3" y1="5" x2="-3" y2="8" stroke="#ffffff" stroke-width="1.5" />
      <line x1="3" y1="5" x2="3" y2="8" stroke="#ffffff" stroke-width="1.5" />
      <line x1="-6" y1="8" x2="6" y2="8" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Node 3: Lightbulb (Blue) -->
    <g transform="translate(0, -100)">
      <circle cx="0" cy="0" r="19" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
      <!-- Bulb icon -->
      <circle cx="0" cy="-3" r="7" fill="#ffffff" />
      <path d="M -4,2 L 4,2 L 2,7 L -2,7 Z" fill="#ffffff" />
      <line x1="-2" y1="9" x2="2" y2="9" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Node 4: Gears (Teal/Green) -->
    <g transform="translate(55, -85)">
      <circle cx="0" cy="0" r="18" fill="#0d9488" stroke="#0f766e" stroke-width="1.5" />
      <!-- Cogwheel icon -->
      <circle cx="0" cy="0" r="9" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,2.5" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>

    <!-- Node 5: Growth Chart (Green) -->
    <g transform="translate(80, -20)">
      <circle cx="0" cy="0" r="18" fill="#16a34a" stroke="#15803d" stroke-width="1.5" />
      <!-- Bar Chart -->
      <rect x="-8" y="2" width="3.5" height="5" fill="#ffffff" />
      <rect x="-3" y="-2" width="3.5" height="9" fill="#ffffff" />
      <rect x="2" y="-6" width="3.5" height="13" fill="#ffffff" />
      <path d="M -8,-2 L -1,-7 L 7,-10" stroke="#ffffff" stroke-width="1.5" fill="none" />
      <polygon points="7,-10 3,-9 5,-6" fill="#ffffff" />
    </g>
  </g>
</svg>
